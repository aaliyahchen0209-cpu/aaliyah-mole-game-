<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>森林打地鼠1945 🐹</title>
  <style>
    :root {
      --pink: #ffb6cf;
      --pink-dark: #e98eaf;
      --purple: #cdb8ff;
      --blue: #b9e5ff;
      --yellow: #ffe6a7;
      --mint: #bdeedc;
      --cream: #fffaf5;
      --brown: #765c65;
      --shadow: 0 12px 30px rgba(130, 91, 116, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC",
        "Microsoft JhengHei", sans-serif;
      color: var(--brown);
      background:
        radial-gradient(circle at 10% 10%, #ffe3ef 0 7%, transparent 8%),
        radial-gradient(circle at 90% 15%, #e4d9ff 0 6%, transparent 7%),
        radial-gradient(circle at 8% 88%, #d9f5eb 0 7%, transparent 8%),
        linear-gradient(135deg, #fff6f9, #f5f0ff 48%, #eefaff);
      display: flex;
      justify-content: center;
      padding: 28px 14px 42px;
    }

    .game {
      width: min(920px, 100%);
      text-align: center;
    }

    .title {
      margin: 5px 0 4px;
      font-size: clamp(30px, 6vw, 52px);
      letter-spacing: 2px;
      color: #8c6f82;
      text-shadow: 0 4px 0 #fff;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #a48799;
      font-size: 15px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.82);
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 18px;
      backdrop-filter: blur(8px);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      border-radius: 22px;
      padding: 11px 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 25px;
    }

    .score { background: #ffe1ec; }
    .time { background: #dff4ff; }
    .combo { background: #eee5ff; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      color: #765c65;
      transition: transform .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(.96);
    }

    #startBtn {
      background: linear-gradient(135deg, #ffb6cf, #cdb8ff);
      padding: 13px 25px;
      border-radius: 999px;
      box-shadow: 0 7px 16px rgba(199, 148, 186, .25);
    }

    .hint {
      font-size: 13px;
      color: #a48799;
    }

    .board {
      --hole-size: clamp(78px, 18vw, 132px);
      display: grid;
      grid-template-columns: repeat(3, var(--hole-size));
      justify-content: center;
      gap: clamp(15px, 4vw, 34px);
      padding: 18px 4px 25px;
    }

    .hole {
      position: relative;
      width: var(--hole-size);
      aspect-ratio: 1;
      border-radius: 50%;
      background: linear-gradient(145deg, #d5b0a1, #b98d80);
      box-shadow:
        inset 0 8px 0 rgba(255,255,255,.2),
        inset 0 -10px 14px rgba(102,70,63,.24),
        0 9px 0 #a97c72;
      overflow: hidden;
      cursor: none;
    }

    .hole::after {
      content: "";
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      background: rgba(91, 61, 56, .23);
      z-index: 0;
    }

.mole {
  position: absolute;
  z-index: 2;
  left: 12%;
  bottom: -5%;
  width: 76%;
  aspect-ratio: 1;
  background: transparent;
  border: none;
  box-shadow: none;
  transform: translateY(105%);
  transition: transform .22s cubic-bezier(.2,.85,.25,1.2);
  user-select: none;
}

.mole.up {
  transform: translateY(0%);
}
    .mole.hit {
  animation: hit .5s ease forwards;
  transition: none;
}
@keyframes hit {
  0% {
    transform: translateY(5%) scale(1);
    transition: none;
  }
  35% {
    transform: translateY(5%) scale(.86) rotate(-4deg);
  }
  100% {
    transform: translateY(105%) scale(.7);
  }
}
    .feedback {
  position: absolute;
  left: calc(50% + 8px);
  top: 35%;
  transform: translateX(-50%);
  z-index: 10;
}
@keyframes feedback {
  0% {
    opacity: 0;
    transform: translate(-50%, 15px) scale(.65) rotate(-8deg);
  }
  25% {
    opacity: 1;
    transform: translate(-50%, -5px) scale(1.12) rotate(4deg);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -58px) scale(.9) rotate(0);
  }
}

.mole-image {
  position: absolute;
  left: -10%;   /* 將圖片向左偏移，藏起左右的透明空白 */
  top: -20%;    /* 將圖片向上偏移，藏起上下的透明空白 */
  width: 120%;  /* 把圖片放大，讓裡面的地鼠本體變大 */
  height: 120%; /* 把圖片放大 */
  object-fit: contain;
  object-position: center center;
  display: block;
  pointer-events: none;
}
    /* 自訂錘子 */
#gameHammer {
  position: fixed;
  left: 0;
  top: 0;
  width: 110px;
  height: 110px;
  object-fit: contain;
  pointer-events: none;
  z-index: 9999;
  display: none;
  transform: translate(-20%, -75%);
}
    /* ===== 遊戲結束畫面 ===== */
.end-screen {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0, 0, 0, 0.45);
}

.end-card {
  position: relative;
  width: min(92vw, 900px);
}

.end-card img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 90vh;
  object-fit: contain;
}

.final-score {
  position: absolute;
  left: 63%;
  top: 61.5%;
  transform: translate(-50%, -50%);
  width: 29%;
  text-align: center;
  font-size: clamp(24px, 4vw, 42px);
  font-weight: 900;
  color: #8b4d2e;
}
    .restart-area {
  position: absolute;
  left: 31%;
  top: 70%;
  width: 38%;
  height: 22%;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
}
    .start-intro {
  position: absolute;
  left: 18%;
  top: 54%;
  width: 64%;
  height: 26%;
  padding: 10px;
  color: #765c3b;
  font-size: clamp(12px, 1.4vw, 18px);
  line-height: 1.5;
  text-align: center;
  overflow: auto;
}
/* ===== 遊戲開始介面 ===== */
.start-screen {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: flex;
  justify-content: center;
  align-items: center;
 background: rgba(255, 255, 255, 0.18);
}

.start-card {
  position: relative;
  width: min(100vw, 150vh);
}

.start-card img {
  display: block;
  width: 100%;
  height: auto;
}

.start-area {
  position: absolute;
  left: 32%;
  top: 76%;
  width: 36%;
  height: 18%;
  background: transparent;
  border: none;
  padding: 0;
  box-shadow: none;
  cursor: pointer;
  transform: none;
}

.start-area:hover,
.start-area:active {
  transform: none;
}

.start-screen img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
  </style>
</head>

<body>

  <!-- 遊戲開始介面 -->
<div id="startScreen" class="start-screen">
  <div class="start-card">
    <img
      src="start-game-sheet.png"
      alt="森林打地鼠開始畫面"
    />
<div class="start-intro">
  <strong>歡迎來到森林打地鼠！</strong><br>
  森林裡的小地鼠正調皮地探出頭來，快拿起你的木槌，抓住牠們吧！<br>
  🌼 <strong>遊戲規則</strong>
    - 遊戲時間為 30 秒。<br>
    - 每成功打中一隻地鼠，可獲得 10 分。<br>
    - 連續擊中 5 次，可獲得額外獎勵 5 分。<br>
  <strong>看看時間結束前，你能拿到幾分吧！🌿</strong>
</div>
    <button
      id="startArea"
      class="start-area"
      type="button"
      aria-label="開始遊戲"
    ></button>
  </div>
</div>

  <main class="game">
    <h1 class="title">🐹 森林打地鼠</h1>
    <p class="subtitle">準備好了嗎？抓住冒出來的小地鼠！</p>

    <section class="panel">
      <div class="hud">
        <div class="stat score">分數<strong id="score">0</strong></div>
        <div class="stat time">時間<strong id="time">30</strong></div>
        <div class="stat combo">連擊<strong id="combo">0</strong></div>
      </div>

      <div class="controls">
        <button id="startBtn">開始遊戲 ✨</button>
        <span class="hint">點擊／輕觸地鼠得分</span>
      </div>

      <div id="board" class="board" aria-label="打地鼠遊戲區"></div>

     <div id="gameOver" class="game-over" style="display: none;">
  按下「開始遊戲」開始！
</div>
    </section>
  </main>
<!-- 遊戲結束畫面 -->
<div id="endScreen" class="end-screen" style="display: none;">
  <div class="end-card">
    <img src="end-game-sheet.png" alt="遊戲結束" />
    <div id="finalScore" class="final-score"></div>
    <button
  id="restartArea"
  class="restart-area"
  type="button"
  aria-label="重新開始"
></button>
  </div>
</div>
<img
  id="gameHammer"
  src="hammer_1.png"
  alt=""
  draggable="false"
/>
  <script>
 
const board = document.getElementById("board");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const comboEl = document.getElementById("combo");
const startBtn = document.getElementById("startBtn");
const gameOverEl = document.getElementById("gameOver");
// ===== 自訂錘子 =====
const gameHammer = document.getElementById("gameHammer");
let hammerTimer = null;
    
// 滑鼠移入遊戲區域時顯示錘子
  
board.addEventListener("pointerenter", (event) => {
  gameHammer.src = "hammer_1.png";
  gameHammer.style.left = event.clientX + "px";
  gameHammer.style.top = event.clientY + "px";
  gameHammer.style.display = "block";
});

// 錘子跟著滑鼠移動
board.addEventListener("pointermove", (event) => {
  gameHammer.style.left = event.clientX + "px";
  gameHammer.style.top = event.clientY + "px";
  gameHammer.style.display = "block";
});

// 離開遊戲區域時隱藏
board.addEventListener("pointerleave", () => {
  gameHammer.style.display = "none";
});

// 點擊時切換成 hammer_5，再回到 hammer_1
board.addEventListener("pointerdown", (event) => {
  gameHammer.style.left = event.clientX + "px";
  gameHammer.style.top = event.clientY + "px";
  gameHammer.style.display = "block";

  clearTimeout(hammerTimer);

  gameHammer.src = "hammer_5.png";

  hammerTimer = setTimeout(() => {
    gameHammer.src = "hammer_1.png";
    hammerTimer = null;
  }, 180);
});
const HOLE_COUNT = 9;
const GAME_TIME = 30;

let score = 0;
let combo = 0;
let timeLeft = GAME_TIME;
let gameRunning = false;
let currentMole = null;

let moleTimer = null;
let countdownTimer = null;
let appearTimer = null;
let hitTimer = null;
let hitCleanupTimer = null;
let blinkTimer = null;

function setFrame(mole, frame) {
  const img = mole.querySelector(".mole-image");
  if (img) img.src = `mole_${frame}.png`;
}

function createBoard() {
  board.innerHTML = "";

  for (let i = 0; i < HOLE_COUNT; i++) {
    const hole = document.createElement("div");
    hole.className = "hole";
    hole.dataset.index = i;

    const mole = document.createElement("div");
    mole.className = "mole";

    const img = document.createElement("img");
    img.className = "mole-image";
    img.src = "mole_1.png";
    img.alt = "地鼠";

    mole.appendChild(img);
    hole.appendChild(mole);
    board.appendChild(hole);

    mole.addEventListener("click", (event) => {
      event.stopPropagation();
      hitMole(mole, hole);
    });
  }
}

function clearAnimationTimers() {
  clearInterval(appearTimer);
  clearInterval(hitTimer);
  clearTimeout(hitCleanupTimer);
  clearInterval(blinkTimer);

  appearTimer = null;
  hitTimer = null;
  hitCleanupTimer = null;
  blinkTimer = null;
}

function playAppearAnimation(mole) {
  clearInterval(appearTimer);

  let frame = 1;
  setFrame(mole, frame);

  appearTimer = setInterval(() => {
    if (!gameRunning || currentMole !== mole ||
        !mole.classList.contains("up")) {
      clearInterval(appearTimer);
      appearTimer = null;
      return;
    }

    frame = frame >= 8 ? 1 : frame + 1;
    setFrame(mole, frame);
  }, 100);
}

function playHitAnimation(mole) {
  clearInterval(appearTimer);
  appearTimer = null;
  clearInterval(hitTimer);

  let frame = 9;
  setFrame(mole, frame);

  hitTimer = setInterval(() => {
    if (frame < 14) {
      frame++;
      setFrame(mole, frame);
    } else {
      clearInterval(hitTimer);
      hitTimer = null;
    }
  }, 75);
}

function hitMole(mole, hole) {
  if (!gameRunning || !mole.classList.contains("up")) return;

  clearTimeout(moleTimer);
  clearInterval(appearTimer);
  appearTimer = null;

  score += 10;
  combo += 1;

  if (combo >= 5) score += 5;

  updateHUD();
  showFeedback(hole, combo >= 5 ? "BONUS! ✨" : "+10 💕");
  createSparkles(hole);

  mole.classList.remove("up");
  mole.classList.add("hit");
  currentMole = null;

  playHitAnimation(mole);

  hitCleanupTimer = setTimeout(() => {
    mole.classList.remove("hit");
    setFrame(mole, 1);
    hitCleanupTimer = null;
  }, 520);

  scheduleNextMole(520);
}

function showFeedback(hole, text) {
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.textContent = text;
  hole.appendChild(feedback);

  requestAnimationFrame(() => feedback.classList.add("show"));
  setTimeout(() => feedback.remove(), 700);
}

function createSparkles(hole) {
  for (let i = 0; i < 5; i++) {
    const spark = document.createElement("span");
    spark.className = "spark";
    spark.style.transform =
      `translate(-50%, -50%) rotate(${i * 72}deg)`;
    hole.appendChild(spark);

    requestAnimationFrame(() => spark.classList.add("show"));
    setTimeout(() => spark.remove(), 500);
  }
}

function hideCurrentMole() {
  clearInterval(appearTimer);
  appearTimer = null;

  if (currentMole) {
    currentMole.classList.remove("up");
    currentMole = null;
  }
}

function showRandomMole() {
  if (!gameRunning) return;

  hideCurrentMole();

  const holes = [...document.querySelectorAll(".hole")];
  const hole = holes[Math.floor(Math.random() * holes.length)];
  const mole = hole.querySelector(".mole");

  mole.classList.remove("hit");
  setFrame(mole, 1);

  currentMole = mole;
  mole.classList.add("up");

  playAppearAnimation(mole);

  const speed = Math.max(
    520,
    1050 - Math.floor(score / 40) * 45
  );

  clearTimeout(moleTimer);
  moleTimer = setTimeout(() => {
    if (mole === currentMole) {
      hideCurrentMole();
      combo = 0;
      updateHUD();
      scheduleNextMole(120);
    }
  }, speed);
}

function scheduleNextMole(delay = 250) {
  clearTimeout(moleTimer);
  moleTimer = setTimeout(showRandomMole, delay);
}

function updateHUD() {
  scoreEl.textContent = score;
  timeEl.textContent = timeLeft;
  comboEl.textContent = combo;
}
// 切換背景音樂
function playMusic(musicId) {
  const musicList = ["startMusic", "playingMusic", "endMusic"];

  musicList.forEach(id => {
    const music = document.getElementById(id);
    music.pause();
    music.currentTime = 0;
  });

  const selectedMusic = document.getElementById(musicId);

  selectedMusic.volume = 0.5;
  selectedMusic.play().catch(error => {
    console.log("音樂播放需要使用者操作");
  });
}
function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("endScreen").style.display = "none";
  clearInterval(countdownTimer);
  clearTimeout(moleTimer);
  clearAnimationTimers();
document.querySelectorAll(".feedback, .spark").forEach((item) => {
  item.remove();
});
  currentMole = null;

  document.querySelectorAll(".mole").forEach((mole) => {
    mole.classList.remove("up", "hit");
    setFrame(mole, 1);
  });

  score = 0;
  combo = 0;
  timeLeft = GAME_TIME;
  gameRunning = true;
  playMusic("playingMusic");

  updateHUD();
  gameOverEl.textContent = "快快快！地鼠出現了！🐹";
  startBtn.textContent = "重新開始 🔄";

  showRandomMole();

  countdownTimer = setInterval(() => {
    timeLeft--;
    updateHUD();

    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  playMusic("endMusic");
  gameRunning = false;

  clearInterval(countdownTimer);
  clearTimeout(moleTimer);
  clearAnimationTimers();
  hideCurrentMole();
  
document.getElementById("endScreen").style.display = "flex";
  document.getElementById("finalScore").textContent = score;
  document.querySelectorAll(".mole").forEach((mole) => {
    mole.classList.remove("up", "hit");
    setFrame(mole, 1);
  });

  gameOverEl.textContent =
    `遊戲結束！你的分數是 ${score} 分 🎀`;
  startBtn.textContent = "再玩一次 ✨";
}
document.getElementById("restartArea").addEventListener("click", () => {
  document.getElementById("endScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
  playMusic("startMusic");
});
document.getElementById("startArea").addEventListener("click", startGame);
startBtn.addEventListener("click", startGame);

createBoard();
    // 第一次點擊頁面時，啟動開始音樂
document.addEventListener("pointerdown", function startBackgroundMusic() {
  playMusic("startMusic");
}, { once: true });
updateHUD();

  </script>
  <!-- 背景音樂 -->
<audio id="startMusic" src="start-game-music.mp3" loop></audio>
<audio id="playingMusic" src="playing-game-music.mp3" loop></audio>
<audio id="endMusic" src="end-game-music.mp3" loop></audio>
</body>
</html>
